[package]
name = "waycal"
version = "0.2.1"
edition = "2024"
description = "A tiny Waybar calendar popup for wlr-layer-shell compositors"
license = "MIT"
repository = "https://github.com/forrestknight/waycal"
readme = "README.md"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
